# ===============================
# 🏷️ CẤU HÌNH CƠ BẢN
# ===============================
server.port=8089
spring.application.name=voucher-service
server.servlet.context-path=/voucher

# ===============================
# 💾 KẾT NỐI DATABASE
# ===============================
spring.datasource.url=jdbc:mysql://db:3306/hyperbuy_voucher_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=baotrong
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# 🧱 JPA & HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# ===============================
# 🕒 TIMEZONE
# ===============================
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.adjust-dates-to-context-time-zone=false

# ===============================
