server.port=8081

spring.datasource.url=jdbc:mysql://db:3306/hyperbuy_product_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=baotrong

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ====== CẤU HÌNH UPLOAD + STATIC RESOURCE ======

# Thư mục base trong container (trùng với docker-compose)
app.upload.base-storage-path=/app/uploads
# Thư mục con cho ảnh sản phẩm
app.upload.product-images-subdir=product-images

# 👉 Property mà code @Value("${app.upload.dir}") đang dùng
app.upload.dir=${app.upload.base-storage-path}/${app.upload.product-images-subdir}

# URL public dùng để truy cập ảnh
app.static-resource.public-path-pattern=/files/**
# Map URL /files/** -> thư mục trong container
app.static-resource.filesystem-location=file:${app.upload.dir}/

# Cấu hình Cloudinary URL (Lấy từ môi trường Docker)
cloudinary.url=${CLOUDINARY_URL}

# ===============================================

server.forward-headers-strategy=NATIVE 
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

