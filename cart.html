<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giỏ Hàng – HyperBuy</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="main-header">
  <nav id="main-navbar">
    <div class="container nav-container">
      <a href="index.html" class="nav-brand">⚡ HyperBuy</a>
      <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation">
        <i class="fas fa-bars"></i>
      </button>
      <ul id="main-nav" class="nav-links">
        <li><a href="index.html" class="nav-link"><i class="fas fa-home"></i> Trang Chủ</a></li>
        <li><a href="products.html" class="nav-link"><i class="fas fa-box"></i> Sản Phẩm</a></li>
        <li id="nav-profile" style="display:none;"><a href="profile.html" class="nav-link"><i class="fas fa-user"></i> Hồ Sơ</a></li>
        <li id="nav-my-orders" style="display:none;"><a href="my-orders.html" class="nav-link"><i class="fas fa-receipt"></i> Đơn Hàng</a></li>
        <li id="nav-admin-dashboard" style="display:none;"><a href="admin.html" class="nav-link"><i class="fas fa-cogs"></i> Quản Trị</a></li>
        <li><a href="minigame.html" class="nav-link"><i class="fas fa-gamepad"></i> MiniGame</a></li>
        <li id="nav-cart-link-li">
          <a href="cart.html" class="nav-link active">
            <i class="fas fa-shopping-cart"></i> Giỏ Hàng
            <span class="cart-item-count-nav" style="display:none;"></span>
          </a>
        </li>
        <li id="nav-notification-bell" style="display:none; position:relative;">
          <a href="#" id="notification-bell-link" class="nav-link nav-link-bell" title="Thông báo">
            <i class="fas fa-bell"></i>
            <span id="notification-count" class="notification-badge" style="display:none;"></span>
          </a>
          <div id="notification-dropdown" class="notification-list-dropdown">
            <div class="notification-dropdown-header">Thông báo</div>
            <ul id="notification-list-items" class="notification-list">
              <li><a class="dropdown-item-notif">Không có thông báo nào.</a></li>
            </ul>
            <div class="notification-dropdown-footer">
              <a href="notifications.html" class="view-all-notifications">Xem tất cả thông báo</a>
            </div>
          </div>
        </li>
        <li id="nav-login"><a href="login.html" class="nav-link"><i class="fas fa-sign-in-alt"></i> Đăng Nhập</a></li>
        <li id="nav-register"><a href="register.html" class="nav-link"><i class="fas fa-user-plus"></i> Đăng Ký</a></li>
        <li id="nav-logout" style="display:none;"><a href="#" class="nav-link"><i class="fas fa-sign-out-alt"></i> Đăng Xuất</a></li>
      </ul>
    </div>
  </nav>
</header>

<main class="container">
  <section id="cart-items">
    <h2><i class="fas fa-shopping-cart"></i> Giỏ hàng của bạn</h2>
    <div id="cart-grid">
      <p>Giỏ hàng của bạn đang trống.</p>
    </div>
    <div id="cart-summary"></div>
    <div id="cart-actions">
      <button class="btn btn-danger" id="btn-clear-cart">
        <i class="fas fa-trash"></i> Xóa Hết Giỏ Hàng
      </button>
    </div>
  </section>
</main>

<footer>
  <div class="container">
    <p>© <span id="current-year"></span> HyperBuy. Mọi quyền được bảo lưu.</p>
  </div>
</footer>

<script src="js/main.js"></script>
<script>
  document.getElementById('nav-toggle').addEventListener('click', () => {
    document.getElementById('main-nav').classList.toggle('open');
  });
</script>
</body>
</html>
